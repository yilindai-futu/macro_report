# dev 环境手动触发定时脚本。
name: run-script

run-name: "run-script ${{ inputs.script_name }} (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: "脚本名（与 app/schedules.yaml 中的 key 一致）"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      CLUSTER: macro-report-dev
    steps:
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/AppDeployRole-MacroReport-Development
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: macro-report-run-script-gha

      - name: Resolve network and task parameters
        id: params
        run: |
          set -euo pipefail
          SSM_SHARED="/app/meerkat/dev/shared"
          SUBNET_IDS=$(aws ssm get-parameter \
            --name "/infra/bl/dev/ap-east-1/network/subnet-ids/priv" \
            --query Parameter.Value --output text)
          PG_SG=$(aws ssm get-parameter \
            --name "${SSM_SHARED}/postgres-sg-id" \
            --query Parameter.Value --output text)
          VPC_ID=$(aws ssm get-parameter \
            --name "/infra/bl/dev/ap-east-1/network/vpc-id" \
            --query Parameter.Value --output text)
          SVC_SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=group-name,Values=${CLUSTER}-svc" \
            --query "SecurityGroups[0].GroupId" --output text)
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${CLUSTER}-jobs" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "subnet_ids=${SUBNET_IDS}"         >> "$GITHUB_OUTPUT"
          echo "security_groups=${SVC_SG},${PG_SG}" >> "$GITHUB_OUTPUT"
          echo "task_def=${TASK_DEF}"             >> "$GITHUB_OUTPUT"

      - name: Run script task
        id: run_task
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${{ steps.params.outputs.task_def }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.params.outputs.subnet_ids }}],securityGroups=[${{ steps.params.outputs.security_groups }}],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"macro-report-job\",\"command\":[\"python\",\"run_script.py\",\"${{ inputs.script_name }}\"]}]}" \
            --query "tasks[0].taskArn" --output text)
          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Wait for task completion
        timeout-minutes: 120
        run: |
          set -euo pipefail
          TASK_ARN="${{ steps.run_task.outputs.task_arn }}"
          MAX_ATTEMPTS=720
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws ecs describe-tasks \
              --cluster "${CLUSTER}" --tasks "${TASK_ARN}" \
              --query "tasks[0].lastStatus" --output text)
            echo "[${ATTEMPT}] status=${STATUS}"
            if [ "$STATUS" = "STOPPED" ]; then break; fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10
          done
          if [ "$STATUS" != "STOPPED" ]; then
            echo "Timed out waiting for task to stop"
            exit 1
          fi
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[0].exitCode" --output text)
          echo "Script exited with code: ${EXIT_CODE}"
          if [ "$EXIT_CODE" != "0" ]; then exit 1; fi
