name: Destroy dev-server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 yes 确认销毁 macro-report dev-server 所有资源"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.6.2"

      - uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/AppDeployRole-MacroReport-Development
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: macro-report-dev-server-destroy-gha

      - name: Write backend config
        run: |
          cat > dev-server/iac/backend.dev.hcl <<EOF
          bucket                = "balance-tf-state-dev-ap-east-1"
          key                   = "app/macro-report/dev-server/dev/terraform.tfstate"
          region                = "ap-east-1"
          dynamodb_table        = "balance-tf-locks-dev-ap-east-1"
          encrypt               = true
          workspace_key_prefix  = "app/macro-report/dev-server/dev/workspaces"
          EOF

      - name: Tofu init and destroy
        working-directory: dev-server/iac
        run: |
          tofu init -backend-config=backend.dev.hcl
          tofu destroy -input=false -auto-approve \
            -var="env=dev" \
            -var="region=${AWS_REGION}"
