# staging 分支推送 & prod tag 触发。
# 部署顺序：deploy-app（IaC）→ migrate（有变更才跑，并行）→ force-deploy（镜像已在跑可跳过）
name: deploy

run-name: "deploy → ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || github.ref_name }} (${{ github.actor }})"

on:
  push:
    branches:
      - staging
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db-migration: ${{ steps.detect.outputs.db-migration }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect migration path changes
        id: detect
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            if [ -z "${PREV}" ]; then
              echo "No previous v* tag; run migrate"
              echo "db-migration=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Comparing ${PREV}..HEAD"
            git diff --name-only "${PREV}" HEAD > /tmp/changed.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No before SHA; run migrate"
              echo "db-migration=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Comparing ${BEFORE}..${{ github.sha }}"
            git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed.txt
          fi
          cat /tmp/changed.txt
          echo "db-migration=$(grep -qE '^app/(migrations/|init_db\.py)' /tmp/changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-app:
    needs: [changes]
    uses: ./.github/workflows/_deploy-app.yml
    with:
      working_directory: iac
      docker_context: app
      ecr_repository: app-macro-report
      env: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      env_pascal: ${{ startsWith(github.ref, 'refs/tags/') && 'Production' || 'Staging' }}
      gh_environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production-app' || 'staging' }}
      skip_force_deploy: true
    secrets: inherit

  migrate-db:
    needs: [changes, deploy-app]
    if: |
      always() &&
      needs.deploy-app.result == 'success' &&
      needs.changes.outputs.db-migration == 'true'
    uses: ./.github/workflows/_db-migrate.yml
    with:
      env: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
      env_pascal: ${{ startsWith(github.ref, 'refs/tags/') && 'Production' || 'Staging' }}
      gh_environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production-app' || 'staging' }}
      ecr_repository: app-macro-report
    secrets: inherit

  force-deploy:
    needs: [changes, deploy-app, migrate-db]
    if: |
      always() &&
      needs.deploy-app.result == 'success' &&
      (needs.migrate-db.result == 'success' || needs.migrate-db.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production-app' || 'staging' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DESIRED_TAG: ${{ needs.deploy-app.outputs.image_tag }}
      IMAGE_IS_NEW: ${{ needs.deploy-app.outputs.image_is_new }}
    steps:
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/AppDeployRole-MacroReport-${{ startsWith(github.ref, 'refs/tags/') && 'Production' || 'Staging' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: macro-report-force-deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}-gha

      - name: Force new ECS deployment if needed
        id: roll
        run: |
          set -euo pipefail
          ENV="${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}"
          CLUSTER="macro-report-${ENV}"
          DESIRED="${DESIRED_TAG}"
          if [ -z "${DESIRED}" ]; then
            echo "Missing desired image tag from deploy-app" >&2
            exit 1
          fi

          RESULT=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$CLUSTER" --region "$AWS_REGION" \
            --query '[length(services[0].deployments), services[0].deployments[0].rolloutState, services[0].taskDefinition]' \
            --output text)
          NDEPLOYS=$(echo "$RESULT" | awk '{print $1}')
          STATE=$(echo "$RESULT" | awk '{print $2}')
          TD=$(echo "$RESULT" | awk '{print $3}')
          CURRENT_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TD" --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)

          TD_ON_DESIRED=false
          case "${CURRENT_IMAGE}" in
            *":${DESIRED}") TD_ON_DESIRED=true ;;
          esac

          RUNNING_ON_DESIRED=false
          mapfile -t TASK_ARNS < <(
            aws ecs list-tasks --cluster "$CLUSTER" --service-name "$CLUSTER" \
              --desired-status RUNNING --region "$AWS_REGION" \
              --query 'taskArns[]' --output text | tr '\t' '\n' | awk 'NF'
          )
          if [ "${#TASK_ARNS[@]}" -gt 0 ]; then
            RUNNING_ON_DESIRED=true
            while IFS= read -r img; do
              [ -z "$img" ] && continue
              case "$img" in
                *":${DESIRED}") ;;
                *) RUNNING_ON_DESIRED=false ;;
              esac
            done < <(
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "${TASK_ARNS[@]}" \
                --region "$AWS_REGION" \
                --query 'tasks[].containers[0].image' --output text | tr '\t' '\n'
            )
          fi

          if [ "$RUNNING_ON_DESIRED" = "true" ] && [ "$NDEPLOYS" = "1" ] && [ "$STATE" = "COMPLETED" ]; then
            echo "skip_wait=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TD_ON_DESIRED" = "true" ] && { [ "$NDEPLOYS" != "1" ] || [ "$STATE" != "COMPLETED" ]; }; then
            echo "skip_wait=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${CLUSTER}" \
            --force-new-deployment \
            --region "${AWS_REGION}"
          echo "skip_wait=false" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service stable
        if: steps.roll.outputs.skip_wait != 'true'
        run: |
          set -euo pipefail
          ENV="${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}"
          CLUSTER="macro-report-${ENV}"
          TIMEOUT=1200
          INTERVAL=15
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            RESULT=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$CLUSTER" --region "$AWS_REGION" \
              --query '[length(services[0].deployments), services[0].deployments[0].rolloutState]' \
              --output text)
            NDEPLOYS=$(echo "$RESULT" | awk '{print $1}')
            STATE=$(echo "$RESULT" | awk '{print $2}')
            if [ "$STATE" = "COMPLETED" ] && [ "$NDEPLOYS" = "1" ]; then
              echo "Service stable."
              exit 0
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Timed out after ${TIMEOUT}s"
          exit 1
